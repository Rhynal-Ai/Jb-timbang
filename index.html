<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard WB QAQC</title>
    <!-- Masukkan script Tailwind CSS, Chart.js, atau CDN lain yang digunakan di project Anda -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-5 rounded-lg shadow-lg flex items-center space-x-3">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-green-700"></div>
            <span class="text-gray-700 font-medium">Memuat Data...</span>
        </div>
    </div>

    <!-- Layout Utama -->
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-green-900 text-white flex flex-col justify-between">
            <div class="p-5">
                <h1 class="text-xl font-bold">Dashboard WB QAQC</h1>
                <p id="entityTitle" class="text-xs text-green-300 mt-1">PT. Citra Lampia Mandiri</p>
                <nav class="mt-8 space-y-2">
                    <a href="#" onclick="switchTab('timbang')" class="block py-2.5 px-4 rounded transition bg-green-800">Dashboard Utama</a>
                    <a href="#" onclick="switchTab('kecepatan')" class="block py-2.5 px-4 rounded transition hover:bg-green-800">Kecepatan Rata-Rata</a>
                </nav>
            </div>
            <div class="p-5 border-t border-green-800">
                <span id="userRoleLabel" class="text-xs block text-green-300 mb-2">Admin Pusat</span>
                <button onclick="logout()" class="w-full bg-green-800 hover:bg-green-700 text-white py-2 rounded text-sm transition">Keluar</button>
            </div>
        </aside>

        <!-- Konten Utama -->
        <main class="flex-1 overflow-y-auto p-8">
            <!-- Tempat Konten Dashboard -->
            <div id="mainContent">
                <h2 id="pageTitle" class="text-2xl font-bold text-gray-800 mb-6">Kecepatan Rata-Rata Unit</h2>
                
                <!-- Filter Section -->
                <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-wrap gap-4 items-center">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Tanggal Mulai</label>
                        <input type="date" id="startDate" class="border rounded px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Tanggal Akhir</label>
                        <input type="date" id="endDate" class="border rounded px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Pilih Subkon</label>
                        <select id="filterSubkon" class="border rounded px-3 py-2 text-sm min-w-[200px]">
                            <option value="">Semua Subkon</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Klasifikasi</label>
                        <select id="filterKlasifikasi" class="border rounded px-3 py-2 text-sm">
                            <option value="">Semua Klasifikasi</option>
                            <option value="STANDAR">Standar</option>
                            <option value="UNDER SPEED">Under Speed</option>
                            <option value="OVER SPEED">Over Speed</option>
                        </select>
                    </div>
                    <div class="self-end">
                        <button onclick="applySpeedFilter()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded text-sm font-semibold">Filter</button>
                    </div>
                </div>

                <!-- Cards Ringkasan -->
                <div class="grid grid-cols-3 gap-6 mb-6">
                    <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-green-500">
                        <span class="text-xs text-gray-400 font-bold uppercase">TOTAL STANDAR</span>
                        <h3 id="totalStandar" class="text-3xl font-bold text-gray-800 mt-2">0</h3>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-yellow-500">
                        <span class="text-xs text-gray-400 font-bold uppercase">TOTAL UNDER SPEED</span>
                        <h3 id="totalUnder" class="text-3xl font-bold text-gray-800 mt-2">0</h3>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-red-500">
                        <span class="text-xs text-gray-400 font-bold uppercase">TOTAL OVER SPEED</span>
                        <h3 id="totalOver" class="text-3xl font-bold text-gray-800 mt-2">0</h3>
                    </div>
                </div>

                <!-- Grafik Section -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="font-semibold text-gray-700 mb-4">Klasifikasi Kecepatan Unit per Subkon</h3>
                    <div class="h-80 relative">
                        <canvas id="speedChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- SCRIPT UTAMA DASHBOARD -->
    <script>
        // Ganti URL di bawah dengan Web App URL hasil Deploy Google Apps Script Anda
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwceOkx1KBXXM_1fALdQqbHd9EXNAJgSh0L27h5B2FspMCUVdItmtwAcqUXOjUmy2wnew/exec";

        let globalTimbangData = [];
        let globalKecepatanData = [];
        let rawDataKecepatanTable = [];
        let cachedSubkons = [];
        let cachedSuppliers = [];

        // Simulasi tipe user (ubah sesuai sistem login Anda, misal: 'admin', 'subkon', atau 'supplier')
        let currentUserType = 'admin'; 
        let currentEntityName = '';

        function cleanStr(str) {
            return str ? String(str).trim().toUpperCase() : "";
        }

        function parseUniversalDate(dateVal) {
            if (!dateVal) return "-";
            // Tambahkan logika parsing tanggal Anda jika diperlukan
            return String(dateVal);
        }

        async function loadDataFromSpreadsheet() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            try {
                let response = await fetch(WEB_APP_URL);
                let json = await response.json();
                
                let rowsTimbang = json.timbang || [];
                globalTimbangData = [];
                let subkonSetDynamic = new Set();
                let supplierSetDynamic = new Set();
                
                let headerTimbangIdx = rowsTimbang.findIndex(r => r && r.some(cell => String(cell).toUpperCase().includes("NETTO") || String(cell).toUpperCase().includes("SUBKON")));
                if (headerTimbangIdx === -1) headerTimbangIdx = 0;
                
                for (let i = headerTimbangIdx + 1; i < rowsTimbang.length; i++) {
                    let row = rowsTimbang[i];
                    if (!row || row.length < 5) continue;
                    
                    let supplier = row[2] ? String(row[2]).trim() : "Lainnya";
                    let subkon = row[3] ? String(row[3]).trim() : "";
                    let netto = parseFloat(row[10]) || 0;
                    let rawDateOut = row[14] || row[13] || row[12] || "";
                    
                    if (subkon && !subkon.toUpperCase().includes("SUBKON")) subkonSetDynamic.add(subkon);
                    if (supplier && !supplier.toUpperCase().includes("SUPPLIER")) supplierSetDynamic.add(supplier);
                    
                    if (currentUserType === 'subkon' && cleanStr(subkon) !== cleanStr(currentEntityName)) continue;
                    if (currentUserType === 'supplier' && cleanStr(supplier) !== cleanStr(currentEntityName)) continue;
                    
                    if (subkon) {
                        globalTimbangData.push({
                            rawRow: row,
                            supplier: supplier,
                            subkon: subkon, 
                            netto: netto,
                            dateOut: parseUniversalDate(rawDateOut)
                        });
                    }
                }

                let rowsKecepatan = json.kecepatan || [];
                globalKecepatanData = [];
                rawDataKecepatanTable = [];
                
                // PENCARIAN HEADER KECEPATAN YANG AMAN (Menghindari baris teks formula/legenda atas)
                let headerSpeedIdx = -1;
                for (let i = 0; i < rowsKecepatan.length; i++) {
                    let rowStr = rowsKecepatan[i].join(" ").toUpperCase();
                    if (rowStr.includes("SUBKON") && (rowStr.includes("LAMB") || rowStr.includes("KECEPATAN"))) {
                        headerSpeedIdx = i;
                        break;
                    }
                }
                if (headerSpeedIdx === -1) headerSpeedIdx = 14; 
                
                for (let i = headerSpeedIdx + 1; i < rowsKecepatan.length; i++) {
                    let row = rowsKecepatan[i];
                    if (!row || row.length === 0) continue;
                    
                    let subkon = row[1] ? String(row[1]).trim() : "";
                    
                    // Filter pengaman agar teks keterangan rumus spreadsheet tidak masuk ke data
                    if (!subkon || subkon.includes("<") || subkon.includes("Km/Jam") || subkon.toUpperCase().includes("SUBKON")) continue;
                    
                    let noLambung = row[3] ? String(row[3]).trim() : "-";
                    let rawDateIn = row[5] || "";
                    let speedVal = parseFloat(row[9]);
                    let rawKlasifikasi = row[10] ? String(row[10]).trim() : "";

                    subkonSetDynamic.add(subkon);
                    
                    // Jika login sebagai supplier, abaikan tab kecepatan karena data kecepatan khusus subkon
                    if (currentUserType === 'supplier') continue;
                    if (currentUserType === 'subkon' && cleanStr(subkon) !== cleanStr(currentEntityName)) continue;
                    
                    let klasifikasi = "STANDAR";
                    let valStr = String(rawKlasifikasi).toUpperCase();
                    if (valStr.includes("UNDER") || valStr.includes("LAMBAT")) {
                        klasifikasi = "UNDER SPEED";
                    } else if (valStr.includes("OVER") || valStr.includes("CEPAT") || valStr.includes("TINGGI")) { 
                        klasifikasi = "OVER SPEED";
                    } else if (valStr.includes("STANDAR")) {
                        klasifikasi = "STANDAR";
                    } else if (!isNaN(speedVal)) {
                        if (speedVal < 18) {
                            klasifikasi = "UNDER SPEED";
                        } else if (speedVal > 23.2) {
                            klasifikasi = "OVER SPEED";
                        } else {
                            klasifikasi = "STANDAR";
                        }
                    }

                    let formattedDate = parseUniversalDate(rawDateIn);
                    let textRisk = "Low Risk";
                    if (klasifikasi === "OVER SPEED") textRisk = "High Risk";
                    else if (klasifikasi === "UNDER SPEED") textRisk = "Moderate Risk";
                    
                    let item = {
                        subkon: subkon,
                        noLambung: noLambung,
                        date: formattedDate,
                        speed: !isNaN(speedVal) ? Math.abs(speedVal).toFixed(2) : "-", // Mengubah nilai minus jadi positif secara aman
                        klasifikasi: klasifikasi,
                        risk: textRisk
                    };
                    globalKecepatanData.push(item);
                    rawDataKecepatanTable.push(item);
                }

                if (subkonSetDynamic.size > 0) {
                    cachedSubkons = Array.from(subkonSetDynamic);
                    localStorage.setItem('cachedSubkons', JSON.stringify(cachedSubkons));
                }
                
                if (currentUserType === 'admin') {
                    populateDropdowns();
                }
                
                applySpeedFilter(); 
            } catch (error) {
                console.error("Gagal memuat data:", error);
            } finally {
                document.getElementById('loadingIndicator').classList.add('hidden');
            }
        }

        function populateDropdowns() {
            let select = document.getElementById('filterSubkon');
            if(!select) return;
            select.innerHTML = '<option value="">Semua Subkon</option>';
            cachedSubkons.forEach(sub => {
                let opt = document.createElement('option');
                opt.value = sub;
                opt.textContent = sub;
                select.appendChild(opt);
            });
        }

        function applySpeedFilter() {
            let totalStandar = globalKecepatanData.filter(item => item.klasifikasi === "STANDAR").length;
            let totalUnder = globalKecepatanData.filter(item => item.klasifikasi === "UNDER SPEED").length;
            let totalOver = globalKecepatanData.filter(item => item.klasifikasi === "OVER SPEED").length;

            document.getElementById('totalStandar').textContent = totalStandar;
            document.getElementById('totalUnder').textContent = totalUnder;
            document.getElementById('totalOver').textContent = totalOver;
        }

        function switchTab(tab) {
            // Fungsi navigasi tab Anda
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        window.onload = function() {
            loadDataFromSpreadsheet();
        };
    </script>
</body>
</html>
